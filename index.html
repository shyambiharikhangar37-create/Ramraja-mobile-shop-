<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरी मोबाइल शॉप - Appwrite ऑनलाइन स्टोर</title>
    <!-- Appwrite Web SDK -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background-color: #f02e65; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .admin-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .admin-panel h2 { margin-bottom: 15px; color: #f02e65; font-size: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; width: 100%; }
        button { background-color: #f02e65; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #999; }
        .section-title { margin: 25px 0 15px; color: #222; border-left: 5px solid #f02e65; padding-left: 10px; }
        .mobile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .badge { position: absolute; top: 10px; right: 10px; background: #ff9800; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .card img { width: 100%; height: 220px; object-fit: contain; background: #fff; padding: 10px; }
        .card-body { padding: 15px; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .card-specs { font-size: 13px; color: #666; margin-bottom: 10px; }
        .card-price { font-size: 18px; color: #2e7d32; font-weight: bold; margin-bottom: 12px; }
        .whatsapp-btn { display: block; text-align: center; background-color: #25D366; color: white; text-decoration: none; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 8px; }
        .delete-btn { background-color: #d32f2f; padding: 6px; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <h1>📱 मेरी मोबाइल शॉप</h1>
    <p>बेहतरीन ऑफर्स और नए स्मार्टफोन्स का ऑनलाइन संग्रह</p>
</header>

<div class="container">
    <div class="admin-panel">
        <h2>➕ नया मोबाइल जोड़ें</h2>
        <form id="addMobileForm" class="form-grid">
            <input type="text" id="phoneName" placeholder="मोबाइल का नाम" required>
            <input type="text" id="phoneSpecs" placeholder="डिटेल्स (RAM, स्टोरेज, कैमरा)" required>
            <input type="text" id="phonePrice" placeholder="कीमत (₹ में)" required>
            <input type="file" id="phoneImage" accept="image/*" required>
            <select id="phoneStatus">
                <option value="available">दुकान में उपलब्ध है</option>
                <option value="upcoming">नया आने वाला मोबाइल (Coming Soon)</option>
            </select>
            <button type="submit" id="submitBtn">ऑनलाइन जोड़ें</button>
        </form>
    </div>

    <h2 class="section-title">🔥 जल्द आ रहे हैं (Upcoming Mobiles)</h2>
    <div class="mobile-grid" id="upcomingList">लोड हो रहा है...</div>

    <h2 class="section-title">📱 उपलब्ध स्मार्टफोन्स</h2>
    <div class="mobile-grid" id="availableList">लोड हो रहा है...</div>
</div>

<script>
    const { Client, Databases, Storage, ID, Query } = Appwrite;

    // यहाँ अपनी Appwrite की जानकारी भरें
    const APPWRITE_ENDPOINT = 'https://cloud.appwrite.io/v1'; // अपना रीजनल एंडपॉइंट चेक करें
    const PROJECT_ID = 'YOUR_PROJECT_ID';
    const DATABASE_ID = 'YOUR_DATABASE_ID';
    const COLLECTION_ID = 'YOUR_COLLECTION_ID';
    const BUCKET_ID = 'YOUR_BUCKET_ID';

    // अपना व्हाट्सएप नंबर यहाँ डालें (91 के साथ)
    const shopWhatsAppNumber = "919876543210";

    const client = new Client()
        .setEndpoint(APPWRITE_ENDPOINT)
        .setProject(PROJECT_ID);

    const databases = new Databases(client);
    const storage = new Storage(client);

    // सभी मोबाइल लोड करने का फंक्शन
    async function loadMobiles() {
        const availableList = document.getElementById('availableList');
        const upcomingList = document.getElementById('upcomingList');

        try {
            const response = await databases.listDocuments(
                DATABASE_ID,
                COLLECTION_ID,
                [Query.orderDesc('$createdAt')]
            );

            availableList.innerHTML = '';
            upcomingList.innerHTML = '';

            response.documents.forEach((mobile) => {
                const whatsappMsg = encodeURIComponent(`नमस्ते, मुझे ${mobile.name} (कीमत: ₹${mobile.price}) के बारे में जानकारी चाहिए।`);
                const whatsappLink = `https://wa.me{shopWhatsAppNumber}?text=${whatsappMsg}`;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${mobile.status === 'upcoming' ? '<span class="badge">जल्द आ रहा है</span>' : ''}
                    <img src="${mobile.imageUrl}" alt="${mobile.name}">
                    <div class="card-body">
                        <div class="card-title">${mobile.name}</div>
                        <div class="card-specs">${mobile.specs}</div>
                        <div class="card-price">₹${Number(mobile.price).toLocaleString('en-IN')}</div>
                        <a href="${whatsappLink}" target="_blank" class="whatsapp-btn">WhatsApp पर बुक करें</a>
                        <button class="delete-btn" onclick="deleteMobile('${mobile.$id}')">हटाएं (Delete)</button>
                    </div>
                `;

                if (mobile.status === 'upcoming') {
                    upcomingList.appendChild(card);
                } else {
                    availableList.appendChild(card);
                }
            });
        } catch (error) {
            console.error(error);
            availableList.innerHTML = 'डेटा लोड करने में समस्या आई। Appwrite सेटिंग्स जांचें।';
        }
    }

    // नया मोबाइल अपलोड करें
    document.getElementById('addMobileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "अपलोड हो रहा है...";

        try {
            const name = document.getElementById('phoneName').value;
            const specs = document.getElementById('phoneSpecs').value;
            const price = document.getElementById('phonePrice').value;
            const status = document.getElementById('phoneStatus').value;
            const file = document.getElementById('phoneImage').files;

            // 1. फोटो को Appwrite Storage में अपलोड करें
            const uploadedFile = await storage.createFile(
                BUCKET_ID,
                ID.unique(),
                file
            );

            // 2. अपलोड की गई फोटो का लाइव लिंक प्राप्त करें
            const imageUrl = storage.getFileView(BUCKET_ID, uploadedFile.$id);

            // 3. मोबाइल की जानकारी डेटाबेस में सेव करें
            await databases.createDocument(
                DATABASE_ID,
                COLLECTION_ID,
                ID.unique(),
                {
                    name: name,
                    specs: specs,
                    price: price,
                    status: status,
                    imageUrl: imageUrl.toString()
                }
            );

            document.getElementById('addMobileForm').reset();
            alert("मोबाइल सफलतापूर्वक जुड़ गया!");
            loadMobiles();
        } catch (error) {
            alert("त्रुटि हुई: " + error.message);
        }

        btn.disabled = false;
        btn.innerText = "ऑनलाइन जोड़ें";
    });

    // मोबाइल डिलीट करें
    async function deleteMobile(docId) {
        if (confirm("क्या आप इस मोबाइल को लिस्ट से हटाना चाहते हैं?")) {
            try {
                await databases.deleteDocument(DATABASE_ID, COLLECTION_ID, docId);
                loadMobiles();
            } catch (error) {
                alert("हटाने में समस्या आई: " + error.message);
            }
        }
    }

    // पेज खुलते ही मोबाइल दिखाएं
    loadMobiles();
</script>

</body>
</html>
